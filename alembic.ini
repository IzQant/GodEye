# Alembic 설정 파일 (Day 9).
# 실제 DB 접속 URL은 alembic/env.py에서 .env(DATABASE_URL)를 읽어 주입하므로
# 여기 sqlalchemy.url은 비워둔다.
[alembic]
script_location = alembic
prepend_sys_path = .
# 마이그레이션 파일 이름에 날짜를 붙여 정렬이 쉽도록 함
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
