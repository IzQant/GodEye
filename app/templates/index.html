<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GodEye — PUBG 자기장 예측</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4" style="max-width: 860px;">
  <h3 class="mb-1">GodEye — 다음 자기장 예측</h3>
  <p class="text-muted">matchId로 예측하거나, 전체 지도 화면을 올리고 현재 단계를 입력하세요.</p>

  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-match" type="button">matchId</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-image" type="button">이미지 + 단계</button></li>
  </ul>

  <div class="tab-content border border-top-0 rounded-bottom p-3 bg-white">
    <!-- matchId 경로 -->
    <div class="tab-pane fade show active" id="tab-match">
      <form id="form-match" class="row g-2 align-items-end">
        <div class="col-sm-9">
          <label class="form-label">매치 ID</label>
          <input name="match_id" class="form-control" placeholder="예: 007329f3-0a01-4a6f-..." required>
        </div>
        <div class="col-sm-3 d-grid">
          <button class="btn btn-primary" type="submit">예측</button>
        </div>
      </form>
    </div>

    <!-- 이미지 경로 -->
    <div class="tab-pane fade" id="tab-image">
      <form id="form-image" class="row g-2 align-items-end">
        <div class="col-12">
          <label class="form-label">전체 지도 화면 (게임에서 M 키로 연 큰 지도)</label>
          <input name="image" type="file" accept="image/*" class="form-control" required>
          <div class="form-text">미니맵 구석 창이 아니라 <b>전체 지도</b>를 올려야 정확합니다.</div>
        </div>
        <div class="col-sm-4">
          <label class="form-label">현재 단계(phase)</label>
          <input name="phase" type="number" min="1" max="10" class="form-control" required>
        </div>
        <div class="col-sm-5">
          <label class="form-label">맵</label>
          <select name="map_name" class="form-select" required>
            {% for m in maps %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-sm-3 d-grid">
          <button class="btn btn-primary" type="submit">예측</button>
        </div>

        <!-- 사진 보정: 지도 네 모서리 지정 (사진/여백/기울어짐 대응) -->
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="use-corners">
            <label class="form-check-label" for="use-corners">
              사진 보정 (모니터 촬영 등 지도가 화면을 꽉 채우지 않을 때 — 네 모서리 지정)
            </label>
          </div>
          <input name="corners" type="hidden">
          <div id="calib-box" class="d-none mt-2">
            <p class="mb-1 small text-muted">
              지도 <b>네 꼭짓점을 순서대로 클릭</b>하세요:
              <b>좌상 → 우상 → 우하 → 좌하</b>. 클릭 후 점을 드래그해 미세 보정도 가능합니다.
            </p>
            <div class="d-flex align-items-center gap-2 mb-1">
              <button type="button" class="btn btn-sm btn-outline-secondary" id="auto-corner">자동 감지(보조)</button>
              <button type="button" class="btn btn-sm btn-outline-secondary" id="reset-corner">다시 찍기</button>
              <span class="small text-muted" id="corner-status">0 / 4 지정됨</span>
            </div>
            <canvas id="calib-canvas" class="border rounded" style="max-width:100%; cursor:crosshair;"></canvas>
          </div>
        </div>

        <!-- 검출 실패 시 나타나는 수동 입력: 이미지 위에서 클릭+드래그로 현재 원 지정 -->
        <div class="col-12 mt-2 d-none" id="manual-box">
          <div class="alert alert-warning py-2 mb-2" id="manual-msg"></div>
          <p class="mb-1 small text-muted">아래 이미지에서 <b>현재 흰 원의 중심을 누른 채 바깥으로 드래그</b>해 반경을 맞추세요.</p>
          <canvas id="mark-canvas" class="border rounded" style="max-width:100%; cursor:crosshair;"></canvas>
          <!-- 실제 픽셀 좌표는 여기에 자동 입력됨 -->
          <input name="manual_cx" type="hidden"><input name="manual_cy" type="hidden"><input name="manual_r" type="hidden">
          <div class="mt-2 d-flex gap-2 align-items-center">
            <button class="btn btn-outline-primary" type="submit" id="manual-submit" disabled>표시한 원으로 예측</button>
            <span class="small text-muted" id="manual-readout">아직 원을 지정하지 않음</span>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 결과 -->
  <div class="form-check mt-3">
    <input class="form-check-input" type="checkbox" id="use-heatmap">
    <label class="form-check-label" for="use-heatmap">
      히트맵으로 보기 (다음 원 중심의 확률 분포 — 실험 기능)
    </label>
  </div>
  <div id="result" class="mt-2"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const resultEl = document.getElementById('result');
const manualBox = document.getElementById('manual-box');
const manualMsg = document.getElementById('manual-msg');
const imageForm = document.getElementById('form-image');
const fileInput = imageForm.querySelector('input[name=image]');
const canvas = document.getElementById('mark-canvas');
const readout = document.getElementById('manual-readout');
const submitBtn = document.getElementById('manual-submit');

function card(inner, cls='') { return `<div class="card ${cls}"><div class="card-body">${inner}</div></div>`; }
function num(v){ return v==null ? '-' : Math.round(v).toLocaleString(); }

// ---- 수동 원 지정: 이미지 위 클릭+드래그 ----
let markImg = null;      // 업로드 이미지(Image 객체)
let scale = 1;           // 캔버스 표시크기 → 원본 픽셀 배율
let center = null, radius = 0, dragging = false;

fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => { markImg = img; };
  img.src = URL.createObjectURL(f);
  center = null; radius = 0; syncInputs();
});

function fitCanvas(){
  // 캔버스를 최대 폭 640으로 표시, 원본 픽셀 좌표 보존용 배율 계산
  const maxW = 640;
  const dispW = Math.min(markImg.naturalWidth, maxW);
  scale = markImg.naturalWidth / dispW;
  canvas.width = dispW;
  canvas.height = markImg.naturalHeight / scale;
  redraw();
}
function redraw(){
  const ctx = canvas.getContext('2d');
  ctx.drawImage(markImg, 0, 0, canvas.width, canvas.height);
  if (center){
    ctx.strokeStyle = '#ff3b30'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(center.x, center.y, radius, 0, 2*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(center.x-6,center.y); ctx.lineTo(center.x+6,center.y);
    ctx.moveTo(center.x,center.y-6); ctx.lineTo(center.x,center.y+6); ctx.stroke();
  }
}
function pos(e){
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
canvas.addEventListener('mousedown', e=>{ if(!markImg) return; dragging=true; center=pos(e); radius=0; redraw(); });
canvas.addEventListener('mousemove', e=>{ if(!dragging) return; const p=pos(e); radius=Math.hypot(p.x-center.x,p.y-center.y); redraw(); readoutUpdate(); });
window.addEventListener('mouseup', ()=>{ if(dragging){ dragging=false; syncInputs(); } });

function readoutUpdate(){
  readout.textContent = center ? `중심(${Math.round(center.x*scale)}, ${Math.round(center.y*scale)}) 반경 ${Math.round(radius*scale)} px` : '아직 원을 지정하지 않음';
}

// ---- 사진 보정: 지도 네 꼭짓점 4번 클릭 (+ 드래그 미세보정, 자동감지 보조) ----
const useCorners = document.getElementById('use-corners');
const calibBox = document.getElementById('calib-box');
const calibCanvas = document.getElementById('calib-canvas');
const cornerStatus = document.getElementById('corner-status');
const LABELS = ['좌상(TL)','우상(TR)','우하(BR)','좌하(BL)'];
let cScale = 1, corners = [], dragCorner = -1;

useCorners.addEventListener('change', ()=>{
  calibBox.classList.toggle('d-none', !useCorners.checked);
  imageForm.corners.value = '';
  if (useCorners.checked && markImg) initCalib();
});
fileInput.addEventListener('change', ()=>{ if(useCorners.checked) setTimeout(()=>{ if(markImg) initCalib(); }, 100); });

function initCalib(){
  const maxW = 640;
  const dispW = Math.min(markImg.naturalWidth, maxW);
  cScale = markImg.naturalWidth / dispW;
  calibCanvas.width = dispW;
  calibCanvas.height = markImg.naturalHeight / cScale;
  corners = [];              // 클릭으로 하나씩 채운다
  drawCalib(); syncCorners();
}
function drawCalib(){
  const ctx = calibCanvas.getContext('2d');
  ctx.drawImage(markImg,0,0,calibCanvas.width,calibCanvas.height);
  if (corners.length>1){
    ctx.strokeStyle='#0d6efd'; ctx.lineWidth=2; ctx.beginPath();
    corners.forEach((p,i)=> i? ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    if (corners.length===4) ctx.closePath();
    ctx.stroke();
  }
  corners.forEach((p,i)=>{
    ctx.fillStyle='#0d6efd'; ctx.beginPath(); ctx.arc(p.x,p.y,7,0,6.28); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.fillText(String(i+1),p.x-3,p.y+3);
  });
  const next = corners.length<4 ? ` — 다음: ${LABELS[corners.length]} 클릭` : ' — 완료';
  cornerStatus.textContent = `${corners.length} / 4 지정됨${next}`;
}
function cpos(e){ const r=calibCanvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }

calibCanvas.addEventListener('mousedown', e=>{
  const p=cpos(e);
  // 기존 점 근처면 드래그 보정, 아니면(4점 미만) 새 점 추가
  const near = corners.findIndex(c=>Math.hypot(c.x-p.x,c.y-p.y)<14);
  if (near>=0){ dragCorner=near; }
  else if (corners.length<4){ corners.push(p); drawCalib(); syncCorners(); }
});
calibCanvas.addEventListener('mousemove', e=>{
  if(dragCorner<0) return; corners[dragCorner]=cpos(e); drawCalib(); syncCorners();
});
window.addEventListener('mouseup', ()=>{ dragCorner=-1; });

function syncCorners(){
  imageForm.corners.value = corners.length===4
    ? corners.map(p=>`${Math.round(p.x*cScale)},${Math.round(p.y*cScale)}`).join(';')
    : '';   // 4점 미만이면 보정 미적용(전체 이미지 기준)
}

document.getElementById('reset-corner').addEventListener('click', ()=>{ corners=[]; drawCalib(); syncCorners(); });

// 자동 감지(보조): 서버 추정 4점을 채워 시작점으로. 이후 클릭/드래그로 보정.
document.getElementById('auto-corner').addEventListener('click', async ()=>{
  if(!fileInput.files[0] || !markImg){ alert('먼저 이미지를 선택하세요.'); return; }
  const fd = new FormData(); fd.append('image', fileInput.files[0]);
  try {
    const r = await fetch('/api/detect-corners', {method:'POST', body: fd});
    if(!r.ok) return;
    const data = await r.json();
    corners = data.corners.map(([x,y])=>({x:x/cScale, y:y/cScale}));
    drawCalib(); syncCorners();
  } catch(e){ /* 무시 */ }
});
function syncInputs(){
  const ok = center && radius > 3;
  submitBtn.disabled = !ok;
  imageForm.manual_cx.value = ok ? Math.round(center.x*scale) : '';
  imageForm.manual_cy.value = ok ? Math.round(center.y*scale) : '';
  imageForm.manual_r.value  = ok ? Math.round(radius*scale) : '';
  readoutUpdate();
}

function render(res){
  if (res.needs_manual && !res.predicted){
    manualBox.classList.remove('d-none');
    manualMsg.textContent = '자동 검출 실패: ' + (res.reasons||[]).join(', ') + ' → 아래 이미지에서 현재 원을 직접 표시하세요.';
    if (markImg) fitCanvas();   // 업로드 이미지로 캔버스 준비
  }
  const cur = res.current, pred = res.predicted;
  resultEl.innerHTML = card(`
    <h5 class="card-title">예측 결과 <span class="badge bg-secondary">${res.input_type}</span></h5>
    <p class="mb-1">맵: <b>${res.map ?? '-'}</b> / 단계: <b>${res.phase ?? '-'}</b></p>
    <p class="mb-1">현재 원(맵좌표): ${cur?`(${num(cur.x)}, ${num(cur.y)}) r=${num(cur.radius)}`:'-'}</p>
    <p class="mb-1">예측 다음 원: ${pred?`(${num(pred.x)}, ${num(pred.y)}) r=${num(pred.radius)}`:'-'}</p>
    <p class="mb-0">불확실성 반경(±): ${num(res.confidence_radius)}</p>
  `, 'border-primary');
}

const useHeatmap = document.getElementById('use-heatmap');

async function showOverlay(form){
  // 히트맵 토글이 켜져 있으면 /api/heatmap, 아니면 원 오버레이(/api/visualize)
  const heat = useHeatmap.checked;
  const endpoint = heat ? '/api/heatmap' : '/api/visualize';
  const title = heat ? '다음 원 확률 히트맵' : '지도 오버레이';
  try {
    const r = await fetch(endpoint, { method:'POST', body: new FormData(form) });
    if (!r.ok) return;
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    resultEl.insertAdjacentHTML('beforeend',
      card(`<h6>${title}</h6><img src="${url}" class="img-fluid rounded border">`, 'mt-2'));
  } catch(e){ /* 시각화 실패는 무시(결과 텍스트는 이미 표시됨) */ }
}

function setBusy(form, busy){
  form.querySelectorAll('button[type=submit]').forEach(b=>{ b.disabled = busy; });
}

async function submit(form){
  setBusy(form, true);
  resultEl.innerHTML = card('<div class="d-flex align-items-center gap-2 text-muted"><div class="spinner-border spinner-border-sm"></div> 예측 중...</div>');
  try {
    const r = await fetch('/api/analyze', { method:'POST', body: new FormData(form) });
    let data;
    try { data = await r.json(); } catch { data = {}; }
    if (!r.ok){
      const msg = r.status===429 ? '요청이 너무 잦습니다. 잠시 후 다시 시도하세요.'
                : (data.detail || '알 수 없는 오류');
      resultEl.innerHTML = card(`<div class="text-danger">오류 (${r.status}): ${msg}</div>`);
      return;
    }
    render(data);
    // 히트맵: 현재 원만 있으면 표시(점 예측 불필요). 원 오버레이: 예측이 있을 때.
    if (useHeatmap.checked ? data.current : data.predicted) showOverlay(form);
  } catch(e){
    resultEl.innerHTML = card(`<div class="text-danger">요청 실패(네트워크): ${e}</div>`);
  } finally {
    setBusy(form, false);
  }
}

document.getElementById('form-match').addEventListener('submit', e=>{e.preventDefault(); submit(e.target);});
document.getElementById('form-image').addEventListener('submit', e=>{e.preventDefault(); submit(e.target);});
</script>
</body>
</html>
