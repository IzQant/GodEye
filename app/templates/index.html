<!doctype html>
<html lang="ko" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GodEye — PUBG 자기장 예측</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#020715; --surface:#0a1330; --surface2:#0e1a3d;
      --border:#1b2a57; --text:#e7ecfb; --muted:#8c99c2;
      --gold1:#EB7D00; --gold2:#FFC349; --hot:#ff5a6a;
    }
    body{background:#020715;color:var(--text);min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;}
    .wrap{max-width:900px;margin:0 auto;padding:32px 18px 60px;}
    .brand{margin:14px 0 12px;text-align:center;}
    .brand h1{font-family:'Press Start 2P',monospace;font-size:2.85rem;line-height:1.2;letter-spacing:1px;margin:0;
      background:linear-gradient(180deg,var(--gold2),var(--gold1));-webkit-background-clip:text;
      background-clip:text;-webkit-text-fill-color:transparent;}
    .sub{color:var(--muted);font-size:.92rem;margin-bottom:22px;text-align:center;}
    .panel{background:linear-gradient(180deg,var(--surface2),var(--surface));
      border:1px solid var(--border);padding:0;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.35);}
    .seg{display:flex;gap:6px;padding:10px 10px 0;}
    .seg button{flex:1;border:1px solid transparent;background:transparent;color:var(--muted);
      padding:10px 12px;font-weight:600;cursor:pointer;}
    .seg button.active{color:#fff;background:var(--surface);border-color:var(--border);border-bottom-color:transparent;}
    .pane{padding:20px;display:none;}
    .pane.active{display:block;}
    .body{padding:20px;}
    label.lbl{display:block;font-size:.82rem;color:var(--muted);margin:0 0 6px;}
    .field{margin-bottom:14px;}
    input.ipt,select.ipt{width:100%;box-sizing:border-box;height:44px;background:#060d24;
      border:1px solid var(--border);color:var(--text);padding:10px 12px;outline:none;font-size:.95rem;line-height:1.2;}
    select.ipt{-webkit-appearance:none;appearance:none;padding-right:34px;
      background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
      background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
    input.ipt:focus,select.ipt:focus{border-color:var(--gold2);box-shadow:0 0 0 3px rgba(255,195,73,.18);}
    .hint{font-size:.78rem;color:var(--muted);margin-top:5px;}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
    .btn-go{background:var(--gold2);border:none;color:#231400;font-weight:800;padding:11px 18px;cursor:pointer;width:100%;}
    .btn-go:disabled{opacity:.5;cursor:not-allowed;}
    .btn-ghost{background:#0a1836;border:1px solid var(--border);color:var(--text);padding:9px 16px;font-size:.85rem;cursor:pointer;}
    canvas{max-width:100%;border:1px solid var(--border);background:#04091c;touch-action:none;}
    input[type=range]{width:100%;accent-color:var(--gold2);}
    .step{margin-top:16px;border-top:1px solid var(--border);padding-top:16px;}
    .step h4{font-size:.95rem;font-weight:700;margin:0 0 6px;color:var(--gold2);}
    .btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;}
    .notice{background:rgba(255,207,92,.1);border:1px solid rgba(255,207,92,.35);color:var(--gold2);
      padding:9px 12px;font-size:.85rem;margin-bottom:12px;}
    .rcard{background:linear-gradient(180deg,var(--surface2),var(--surface));border:1px solid var(--border);padding:18px;}
    .rhead{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
    .rhead .t{font-size:1.05rem;font-weight:700;}
    .chip{font-size:.72rem;padding:3px 10px;font-weight:700;}
    .chip-accent{background:rgba(255,195,73,.15);color:#ffcf80;border:1px solid rgba(235,125,0,.5);}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .stat{background:#060d24;border:1px solid var(--border);padding:10px 12px;}
    .stat.wide{grid-column:1 / -1;}
    .stat .k{display:block;font-size:.74rem;color:var(--muted);margin-bottom:3px;}
    .stat .v{font-size:1rem;font-weight:700;} .stat .v.acc{color:var(--gold2);}
    .viz{margin-top:16px;} .viz img{width:100%;border:1px solid var(--border);display:block;}
    .vseg{display:flex;border:1px solid var(--border);width:fit-content;margin-bottom:12px;}
    .vseg button{background:transparent;color:var(--muted);border:none;padding:7px 18px;cursor:pointer;font-weight:600;font-size:.85rem;}
    .vseg button.active{background:var(--gold2);color:#231400;} .vseg button:disabled{opacity:.35;cursor:not-allowed;}
    .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.8rem;color:var(--muted);}
    .legend .it{display:flex;align-items:center;gap:6px;} .swatch{width:14px;height:14px;display:inline-block;}
    .grad{width:60px;height:12px;background:linear-gradient(90deg,#2b3fff,#22d3ee,#ffd000,#ff5a6a);}
    .spinner-border-sm{color:var(--gold2);} .err{color:var(--hot);} .status{font-size:.8rem;color:var(--muted);}
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand"><h1>GodEye</h1></div>
  <div class="sub">PUBG 다음 자기장 예측 · matchId 또는 전체 지도 화면(+현재 단계)을 입력하세요.</div>

  <!-- 화면 1: 입력 + 지도 영역 지정 -->
  <div id="screen-input">
    <div class="panel">
      <div class="seg" role="tablist">
        <button class="active" data-target="tab-match" type="button">matchId</button>
        <button data-target="tab-image" type="button">이미지 + 단계</button>
      </div>

      <div class="pane active" id="tab-match">
        <div class="field">
          <label class="lbl">매치 ID</label>
          <input id="matchid" class="ipt" placeholder="예: 007329f3-0a01-4a6f-...">
        </div>
        <button class="btn-go" id="go-match">예측하기</button>
      </div>

      <div class="pane" id="tab-image">
        <div class="field">
          <label class="lbl">전체 지도 화면 (게임에서 M 키로 연 큰 지도)</label>
          <input id="file" type="file" accept="image/*" class="ipt">
          <div class="hint">전체 지도 · 모니터를 찍은 사진도 괜찮습니다.</div>
        </div>
        <div class="row2">
          <div class="field"><label class="lbl">현재 단계 (phase)</label>
            <input id="phase" type="number" min="1" max="10" class="ipt"></div>
          <div class="field"><label class="lbl">맵</label>
            <select id="map" class="ipt">{% for m in maps %}<option value="{{ m }}">{{ m }}</option>{% endfor %}</select></div>
        </div>

        <div class="step d-none" id="calib-box">
          <h4>지도 영역 지정</h4>
          <div class="hint" style="margin-bottom:8px;">
            <b>영역 지정은 선택사항입니다.</b> 그냥 예측하면 사진에서 지도를 <b>자동 인식</b>해 보정합니다(권장).
            <br>자동 인식이 어긋날 때만 네 꼭짓점을 <b>좌상 → 우상 → 우하 → 좌하</b> 순서로 지정하세요.
          </div>
          <div class="btnrow" style="margin-top:0;margin-bottom:8px;">
            <button type="button" class="btn-ghost" id="auto-corner">자동 감지(보조)</button>
            <button type="button" class="btn-ghost" id="reset-corner">다시 찍기</button>
            <span class="status" id="corner-status">0 / 4 지정됨</span>
          </div>
          <canvas id="calib-canvas" style="cursor:crosshair;"></canvas>
        </div>

        <button class="btn-go" id="go-image" style="margin-top:16px;">예측하기</button>
      </div>
    </div>
  </div>

  <!-- 화면 2: 자동 검출 실패 → 원 직접 표시 -->
  <div id="screen-manual" class="d-none">
    <div class="panel"><div class="body">
      <div class="notice" id="manual-msg"></div>
      <h4 style="font-size:.95rem;font-weight:700;margin:0 0 6px;color:var(--gold2);">현재 원 직접 표시</h4>
      <div class="hint" style="margin-bottom:8px;">
        현재 흰 원의 <b>중심을 탭(클릭)</b>한 뒤, 아래 <b>슬라이더로 반경</b>을 맞추세요.
      </div>
      <canvas id="mark-canvas" style="cursor:crosshair;"></canvas>
      <div style="margin-top:10px;">
        <label class="lbl">반경 조절</label>
        <input id="radius-slider" type="range" min="4" max="800" value="60">
      </div>
      <div class="btnrow">
        <button class="btn-go" style="width:auto;" id="manual-submit" disabled>표시한 원으로 예측</button>
        <button class="btn-ghost" id="manual-back">뒤로</button>
        <span class="status" id="manual-readout">중심을 탭한 뒤 슬라이더로 반경을 조절하세요</span>
      </div>
    </div></div>
  </div>

  <!-- 화면 3: 예측 결과 -->
  <div id="screen-result" class="d-none">
    <div id="result"></div>
    <div class="btnrow"><button class="btn-go" id="restart">처음으로</button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const num = v => v==null ? '-' : Math.round(v).toLocaleString();
const fileInput=$('file'), phaseInput=$('phase'), mapInput=$('map'), matchInput=$('matchid');
const screens = {input:$('screen-input'), manual:$('screen-manual'), result:$('screen-result')};
function showScreen(name){ for(const k in screens) screens[k].classList.toggle('d-none', k!==name); window.scrollTo({top:0,behavior:'smooth'}); }

// 탭
document.querySelectorAll('.seg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); $(b.dataset.target).classList.add('active');
  });
});

// 상태
let markImg=null, scale=1, center=null, radius=0, dragging=false;
let cScale=1, corners=[], cornersValue='', dragCorner=-1;
let currentBuilder=null;

fileInput.addEventListener('change', ()=>{
  const f=fileInput.files[0]; if(!f) return;
  const img=new Image(); img.onload=()=>{ markImg=img; $('calib-box').classList.remove('d-none'); initCalib(); }; img.src=URL.createObjectURL(f);
  center=null; radius=0; corners=[]; cornersValue='';
});

// ---- 보정(4클릭) ----
const calibCanvas=$('calib-canvas'), cornerStatus=$('corner-status');
const LABELS=['좌상(TL)','우상(TR)','우하(BR)','좌하(BL)'];
function initCalib(){
  const dispW=Math.min(markImg.naturalWidth,720); cScale=markImg.naturalWidth/dispW;
  calibCanvas.width=dispW; calibCanvas.height=markImg.naturalHeight/cScale; corners=[]; drawCalib(); syncCorners();
}
function drawCalib(){
  const ctx=calibCanvas.getContext('2d'); ctx.drawImage(markImg,0,0,calibCanvas.width,calibCanvas.height);
  if(corners.length>1){ ctx.strokeStyle='#FFC349'; ctx.lineWidth=2; ctx.beginPath();
    corners.forEach((p,i)=> i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); if(corners.length===4)ctx.closePath(); ctx.stroke(); }
  corners.forEach((p,i)=>{ ctx.fillStyle='#FFC349'; ctx.beginPath(); ctx.arc(p.x,p.y,7,0,6.28); ctx.fill();
    ctx.fillStyle='#231400'; ctx.font='bold 10px sans-serif'; ctx.fillText(String(i+1),p.x-3,p.y+3); });
  cornerStatus.textContent=`${corners.length} / 4 지정됨`+(corners.length<4?` — 다음: ${LABELS[corners.length]} 클릭`:' — 완료');
}
function cpos(e){ const r=calibCanvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
calibCanvas.addEventListener('pointerdown', e=>{ e.preventDefault(); const p=cpos(e);
  const near=corners.findIndex(c=>Math.hypot(c.x-p.x,c.y-p.y)<24);   // 터치 히트영역 확대
  if(near>=0){ dragCorner=near; calibCanvas.setPointerCapture(e.pointerId); }
  else if(corners.length<4){ corners.push(p); drawCalib(); syncCorners(); } });
calibCanvas.addEventListener('pointermove', e=>{ if(dragCorner<0)return; e.preventDefault(); corners[dragCorner]=cpos(e); drawCalib(); syncCorners(); });
calibCanvas.addEventListener('pointerup', ()=>{ dragCorner=-1; });
calibCanvas.addEventListener('pointercancel', ()=>{ dragCorner=-1; });
function syncCorners(){ cornersValue = corners.length===4 ? corners.map(p=>`${Math.round(p.x*cScale)},${Math.round(p.y*cScale)}`).join(';') : ''; }
$('reset-corner').addEventListener('click', ()=>{ corners=[]; drawCalib(); syncCorners(); });
$('auto-corner').addEventListener('click', async ()=>{
  if(!markImg)return; const fd=new FormData(); fd.append('image',fileInput.files[0]);
  try{ const r=await fetch('/api/detect-corners',{method:'POST',body:fd}); if(!r.ok)return;
    const d=await r.json(); corners=d.corners.map(([x,y])=>({x:x/cScale,y:y/cScale})); drawCalib(); syncCorners(); }catch(e){}
});

// ---- 수동 원 지정: 중심 탭 + 슬라이더 반경 (마우스/터치 공통) ----
const canvas=$('mark-canvas'), readout=$('manual-readout'), submitBtn=$('manual-submit'), radiusSlider=$('radius-slider');
function fitCanvas(){ const dispW=Math.min(markImg.naturalWidth,660); scale=markImg.naturalWidth/dispW;
  canvas.width=dispW; canvas.height=markImg.naturalHeight/scale;
  center=null; radius=Math.round(dispW*0.08);
  radiusSlider.max=Math.max(canvas.width,canvas.height); radiusSlider.value=radius;
  redraw(); }
function redraw(){ const ctx=canvas.getContext('2d'); ctx.drawImage(markImg,0,0,canvas.width,canvas.height);
  if(center){ ctx.strokeStyle='#ff5a6a'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(center.x,center.y,radius,0,6.28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(center.x-6,center.y); ctx.lineTo(center.x+6,center.y);
    ctx.moveTo(center.x,center.y-6); ctx.lineTo(center.x,center.y+6); ctx.stroke(); } }
function mpos(e){ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function mUpdate(){ submitBtn.disabled = !(center && radius>3); mReadout(); }
canvas.addEventListener('pointerdown', e=>{ if(!markImg)return; e.preventDefault(); center=mpos(e); redraw(); mUpdate(); });
radiusSlider.addEventListener('input', ()=>{ radius=+radiusSlider.value; redraw(); mUpdate(); });
function mReadout(){ readout.textContent = center?`중심(${Math.round(center.x*scale)}, ${Math.round(center.y*scale)}) 반경 ${Math.round(radius*scale)} px`:'중심을 탭한 뒤 슬라이더로 반경을 조절하세요'; }
$('manual-back').addEventListener('click', ()=> showScreen('input'));
$('manual-submit').addEventListener('click', ()=>{ runAnalyze(); });

// ---- 데이터 조립 ----
function buildFD(){
  const fd=new FormData();
  if(currentBuilder==='match'){ fd.append('match_id', matchInput.value.trim()); return fd; }
  fd.append('image', fileInput.files[0]);
  fd.append('phase', phaseInput.value);
  fd.append('map_name', mapInput.value);
  if(cornersValue) fd.append('corners', cornersValue);
  if(center && radius>3){ fd.append('manual_cx',Math.round(center.x*scale));
    fd.append('manual_cy',Math.round(center.y*scale)); fd.append('manual_r',Math.round(radius*scale)); }
  return fd;
}

// ---- 결과 ----
function circleTxt(c){ return c?`(${num(c.x)}, ${num(c.y)}) · r ${num(c.radius)}`:'-'; }
function legendHtml(heat){ return heat
  ? `<div class="legend"><span class="it"><span class="grad"></span> 확률 낮음 → 높음</span><span class="it"><span class="swatch" style="background:#22d3ee"></span> 현재 안전지대</span></div>`
  : `<div class="legend"><span class="it"><span class="swatch" style="background:#fff"></span> 현재 원</span><span class="it"><span class="swatch" style="background:#4f8cff"></span> 예측 다음 원</span><span class="it"><span class="swatch" style="background:#e6c878"></span> 불확실성 범위</span></div>`; }
function renderResult(res){
  const confM = res.confidence_radius==null?'-':`± ${num(res.confidence_radius/100)} m`;
  $('result').innerHTML = `
    <div class="rcard">
      <div class="rhead"><span class="t">예측 결과</span><span class="chip chip-accent">${res.input_type}</span></div>
      <div class="grid">
        <div class="stat"><span class="k">맵</span><span class="v">${res.map ?? '-'}</span></div>
        <div class="stat"><span class="k">단계 (phase)</span><span class="v">${res.phase ?? '-'}</span></div>
        <div class="stat wide"><span class="k">불확실성 반경</span><span class="v acc">${confM}</span></div>
      </div>
    </div>`;
}
async function preloadViews(){
  const fetchBlob = url => fetch(url,{method:'POST',body:buildFD()}).then(r=>r.ok?r.blob():null).catch(()=>null);
  const [ov,hm] = await Promise.all([fetchBlob('/api/visualize'), fetchBlob('/api/heatmap')]);
  const ovU=ov?URL.createObjectURL(ov):null, hmU=hm?URL.createObjectURL(hm):null;
  if(!ovU && !hmU) return;
  const first = ovU?'ov':'hm';
  const box=document.createElement('div'); box.className='rcard viz';
  box.innerHTML = `
    <div class="vseg">
      <button data-v="ov" ${ovU?'':'disabled'} class="${first==='ov'?'active':''}">원 예측</button>
      <button data-v="hm" ${hmU?'':'disabled'} class="${first==='hm'?'active':''}">히트맵</button>
    </div>
    <img id="viz-img" src="${ovU||hmU}"><div id="viz-legend">${legendHtml(first==='hm')}</div>`;
  $('result').appendChild(box);
  const img=box.querySelector('#viz-img'), leg=box.querySelector('#viz-legend');
  box.querySelectorAll('.vseg button').forEach(b=> b.addEventListener('click', ()=>{
    if(b.disabled)return; box.querySelectorAll('.vseg button').forEach(x=>x.classList.remove('active')); b.classList.add('active');
    const heat=b.dataset.v==='hm'; img.src=heat?hmU:ovU; leg.innerHTML=legendHtml(heat);
  }));
}

async function runAnalyze(){
  document.querySelectorAll('.btn-go').forEach(b=>b.disabled=true);
  $('result').innerHTML = `<div class="rcard"><div class="d-flex align-items-center gap-2" style="color:var(--muted)"><div class="spinner-border spinner-border-sm"></div> 예측 중...</div></div>`;
  showScreen('result');
  try{
    const r=await fetch('/api/analyze',{method:'POST',body:buildFD()});
    let data; try{ data=await r.json(); }catch{ data={}; }
    if(!r.ok){
      const msg = r.status===429?'요청이 너무 잦습니다. 잠시 후 다시 시도하세요.':(data.detail||'알 수 없는 오류');
      $('result').innerHTML = `<div class="rcard err">오류 (${r.status}): ${msg}</div>`; return;
    }
    if(data.needs_manual && !data.predicted){
      $('manual-msg').textContent='자동 검출 실패: '+(data.reasons||[]).join(', ')+' → 현재 원을 직접 표시하세요.';
      showScreen('manual'); if(markImg) fitCanvas(); mUpdate();
      return;
    }
    renderResult(data); preloadViews();
  }catch(e){ $('result').innerHTML=`<div class="rcard err">요청 실패(네트워크): ${e}</div>`; }
  finally{ document.querySelectorAll('.btn-go').forEach(b=>b.disabled=false); }
}

$('go-match').addEventListener('click', ()=>{
  if(!matchInput.value.trim()){ alert('매치 ID를 입력하세요.'); return; }
  currentBuilder='match'; runAnalyze();
});
$('go-image').addEventListener('click', ()=>{
  if(!fileInput.files[0]){ alert('이미지를 선택하세요.'); return; }
  if(!phaseInput.value){ alert('현재 단계(phase)를 입력하세요.'); return; }
  if(!markImg){ alert('이미지를 불러오는 중입니다. 잠시 후 다시 시도하세요.'); return; }
  currentBuilder='image'; runAnalyze();
});

// 처음으로
$('restart').addEventListener('click', ()=>{
  fileInput.value=''; phaseInput.value=''; matchInput.value='';
  markImg=null; center=null; radius=0; corners=[]; cornersValue=''; currentBuilder=null;
  $('calib-box').classList.add('d-none'); $('result').innerHTML='';
  showScreen('input');
});
</script>
</body>
</html>
